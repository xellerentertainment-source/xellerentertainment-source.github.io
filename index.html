<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'; frame-src 'self' https://www.youtube.com;">
    <title>Xeller ENTERTAINMENT</title>
    <link rel="icon" type="image/png" href="/favicon-96x96.png" sizes="96x96" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="shortcut icon" href="/favicon.ico" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <style>
        @font-face {
            font-family: 'OCR A Extended';
            src: url('fonts/OCR A Extended.woff2') format('woff2'),
                 url('fonts/OCR A Extended.woff') format('woff');
            font-weight: normal;
            font-style: normal;
        }

        html, body {
            margin: 0;
            padding: 0;
            min-height: 100vh;
            background-color: #000000;
            color: white;
            font-family: 'OCR A Extended', monospace;
        }

        body {
            display: flex;
            flex-direction: column;
            align-items: center;
            overflow-x: hidden;
            position: relative;
        }

        /* Background styles */
        .background {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            transition: opacity 0.5s ease;
        }

        .background-image {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }

        .logo {
            margin-top: 20px;
            max-width: 621.5px;
            width: 90%;
            height: auto;
            position: relative;
            z-index: 9999;
            transition: opacity 0.5s ease;
        }

        #overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 2;
            pointer-events: none;
        }

        /* Navigation */
        .navigation {
            position: fixed;
            left: 20px;
            top: 50%;
            transform: translateY(-50%);
            z-index: 9998;
        }

        .navigation ul {
            list-style: none;
            padding: 0;
            margin: 0;
        }

        .navigation li {
            margin: 15px 0;
        }

        .navigation a {
            display: block;
            padding: 10px 15px;
            color: white;
            text-decoration: none;
            font-size: 18px;
            position: relative;
            transition: all 0.3s ease;
            text-shadow: 0 0 5px rgba(255, 255, 255, 0.5);
        }

        .navigation a:hover, .navigation a.active {
            transform: scale(1.1);
            text-shadow: 0 0 10px rgba(255, 255, 255, 0.8);
        }

        .navigation a.active:before {
            content: '>';
            position: absolute;
            left: -15px;
        }

        /* Pages Container */
        .pages-container {
            position: relative;
            z-index: 3;
            width: 100%;
            flex-grow: 1;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .page {
            display: none;
            width: 100%;
            max-width: 1200px;
            padding: 20px;
            box-sizing: border-box;
        }

        .page.active {
            display: block;
        }

        /* Custom Button Style */
        .custom-button {
            font-family: 'OCR A Extended', monospace;
            background-color: rgba(0, 0, 0, 0.7);
            color: white;
            border: 1px solid white;
            padding: 12px 24px;
            cursor: pointer;
            text-transform: uppercase;
            font-size: 16px;
            transition: all 0.3s ease;
            position: relative;
            text-shadow: 0 0 5px rgba(255, 255, 255, 0.5);
            box-shadow: 0 0 5px rgba(255, 255, 255, 0.5);
        }

        .custom-button:hover {
            transform: scale(1.05);
            text-shadow: 0 0 10px rgba(255, 255, 255, 0.8);
            box-shadow: 0 0 10px rgba(255, 255, 255, 0.8);
        }

        .custom-button:active {
            transform: scale(0.95);
            animation: button-click 0.3s ease;
        }

        @keyframes button-click {
            0% { transform: scale(0.95); }
            50% { transform: scale(1.1); }
            100% { transform: scale(0.95); }
        }

        .teaser-button-container {
            position: fixed;
            bottom: 30px;
            right: 30px;
            z-index: 5;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        /* Gallery */
        .gallery {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
            width: 100%;
            max-width: 900px;
            margin: 0 auto;
            padding: 20px;
        }

        .gallery-item {
            position: relative;
            overflow: hidden;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.3);
            cursor: pointer;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        .gallery-item:hover {
            transform: scale(1.05);
            box-shadow: 0 8px 16px rgba(0, 0, 0, 0.5);
        }

        .gallery-item img {
            width: 100%;
            height: auto;
            display: block;
            transition: filter 0.3s ease;
        }

        .gallery-item:hover img {
            filter: brightness(1.2);
        }

        /* Download Page */
        .download-content {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 70vh;
        }

        .ellipsis {
            font-size: 48px;
            font-family: 'OCR A Extended', monospace;
            text-shadow: 0 0 10px rgba(255, 255, 255, 0.7);
        }

        /* Video Modal Styles */
        .video-modal {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 80%;
            height: 80%;
            background-color: rgba(0, 0, 0, 0.9);
            z-index: 10000;
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            border-radius: 10px;
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.8);
        }

        .video-container {
            width: 100%;
            height: 90%;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .video-iframe {
            width: 95%;
            height: 95%;
            border: none;
        }

        /* Image Modal */
        .image-modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.9);
            z-index: 10000;
            display: none;
            justify-content: center;
            align-items: center;
        }

        .image-container {
            position: relative;
            max-width: 90%;
            max-height: 90%;
        }

        #modalImage {
            max-width: 100%;
            max-height: 90vh;
            object-fit: contain;
        }

        .close-button {
            position: absolute;
            top: 10px;
            right: 10px;
            background: rgba(255, 255, 255, 0.3);
            color: white;
            border: none;
            border-radius: 50%;
            width: 30px;
            height: 30px;
            cursor: pointer;
            font-size: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background 0.3s ease;
        }

        .close-button:hover {
            background: rgba(255, 255, 255, 0.5);
        }

        /* Media Queries */
        @media screen and (max-width: 768px) {
            .logo {
                margin-top: 10px;
                width: 95%;
            }
            
            .navigation {
                position: fixed;
                left: 0;
                top: 0;
                transform: none;
                width: 100%;
                background-color: rgba(0, 0, 0, 0.8);
                padding: 10px 0;
            }
            
            .navigation ul {
                display: flex;
                justify-content: space-around;
            }
            
            .navigation li {
                margin: 0;
            }
            
            .gallery {
                grid-template-columns: repeat(2, 1fr);
                gap: 10px;
                padding: 10px;
            }
        }

        @media screen and (max-width: 480px) {
            .gallery {
                grid-template-columns: 1fr;
            }
        }

        @media screen and (max-width: 900px) and (orientation: landscape) {
            .logo {
                display: none;
            }
        }
    </style>
    <script defer data-domain="xeller-entertainment.tiiny.site" src="https://analytics.tiiny.site/js/plausible.js"></script>
    <script type="text/javascript" src="https://tiiny.host/ad-script.js"></script>
</head>
<body>
    <!-- Navigation -->
    <div class="navigation">
        <ul>
            <li><a href="#" class="nav-link active" data-page="home">Home</a></li>
            <li><a href="#" class="nav-link" data-page="teasers">Teasers</a></li>
            <li><a href="#" class="nav-link" data-page="download">Download</a></li>
        </ul>
    </div>

    <!-- Background elements -->
    <div class="background">
        <img src="arcade.png" class="background-image" alt="Background">
    </div>
    <div id="overlay"></div>
    <img src="sitelogo.png" class="logo" alt="Xeller ENTERTAINMENT">
    
    <!-- Pages Container -->
    <div class="pages-container">
        <!-- Home Page -->
        <div class="page active" id="home">
            <div class="teaser-button-container">
                <button id="watchTrailer" class="custom-button">Watch Trailer</button>
                <button id="watchTeaser" class="custom-button">Watch Teaser</button>
            </div>
        </div>
        
        <!-- Teasers Page -->
        <div class="page" id="teasers">
            <div class="gallery">
                <div class="gallery-item">
                    <img src="welcome.png" alt="Welcome" data-full="welcome.png">
                </div>
                <div class="gallery-item">
                    <img src="nosignal.png" alt="No Signal" data-full="nosignal.png">
                </div>
                <div class="gallery-item">
                    <img src="cancelled.png" alt="Cancelled" data-full="cancelled.png">
                </div>
                <div class="gallery-item">
                    <img src="107.png" alt="107" data-full="107.png">
                </div>
                <div class="gallery-item">
                    <img src="onethatcreepsinthedark.png" alt="One That Creeps in the Dark" data-full="onethatcreepsinthedark.png">
                </div>
                <div class="gallery-item">
                    <img src="arcade.png" alt="Arcade" data-full="arcade.png">
                </div>
            </div>
        </div>
        
        <!-- Download Page -->
        <div class="page" id="download">
            <div class="download-content">
                <span class="ellipsis">...</span>
            </div>
        </div>
    </div>

    <!-- Video Modal -->
    <div class="video-modal" id="videoModal">
        <div class="video-container" id="videoContainer">
            <!-- The iframe will be created dynamically by JavaScript -->
        </div>
        <button class="close-button" id="closeVideo">✕</button>
    </div>

    <!-- Trailer Modal -->
    <div class="video-modal" id="trailerModal">
        <div class="video-container" id="trailerContainer">
            <!-- The iframe will be created dynamically by JavaScript -->
        </div>
        <button class="close-button" id="closeTrailer">✕</button>
    </div>

    <!-- Image Modal -->
    <div class="image-modal" id="imageModal">
        <div class="image-container">
            <img id="modalImage" src="" alt="Full size image">
        </div>
        <button class="close-button" id="closeImage">✕</button>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            // Navigation functionality
            const navLinks = document.querySelectorAll('.nav-link');
            const pages = document.querySelectorAll('.page');
            const logo = document.querySelector('.logo');
            const background = document.querySelector('.background');
            const videoModal = document.getElementById('videoModal');
            const closeVideoButton = document.getElementById('closeVideo');
            const watchTeaserButton = document.getElementById('watchTeaser');
            const videoContainer = document.getElementById('videoContainer');
            const trailerModal = document.getElementById('trailerModal');
            const closeTrailerButton = document.getElementById('closeTrailer');
            const watchTrailerButton = document.getElementById('watchTrailer');
            const trailerContainer = document.getElementById('trailerContainer');
            const imageModal = document.getElementById('imageModal');
            const modalImage = document.getElementById('modalImage');
            const closeImageButton = document.getElementById('closeImage');
            const galleryItems = document.querySelectorAll('.gallery-item img');
            
            // YouTube video IDs
            const youtubeVideoId = "0E8CW_D1tOQ"; // Teaser
            const trailerVideoId = "RTzR_6xiSZY"; // Trailer
            
            // Initially hide the modals
            videoModal.style.display = 'none';
            
            // Show trailer modal by default
            trailerModal.style.display = 'flex';
            createTrailerIframe();
            watchTrailerButton.textContent = 'Close Trailer';
            
            // Function to create a new YouTube iframe for teaser
            function createVideoIframe() {
                // Clear any existing content
                videoContainer.innerHTML = '';
                
                // Create a new iframe element
                const iframe = document.createElement('iframe');
                iframe.className = 'video-iframe';
                iframe.src = `https://www.youtube.com/embed/${youtubeVideoId}?autoplay=1`;
                iframe.title = "YouTube video player";
                iframe.allow = "accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture";
                iframe.allowFullscreen = true;
                
                // Append the iframe to the container
                videoContainer.appendChild(iframe);
            }
            
            // Function to create a new YouTube iframe for trailer
            function createTrailerIframe() {
                // Clear any existing content
                trailerContainer.innerHTML = '';
                
                // Create a new iframe element
                const iframe = document.createElement('iframe');
                iframe.className = 'video-iframe';
                iframe.src = `https://www.youtube.com/embed/${trailerVideoId}?autoplay=1`;
                iframe.title = "YouTube video player";
                iframe.allow = "accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture";
                iframe.allowFullscreen = true;
                
                // Append the iframe to the container
                trailerContainer.appendChild(iframe);
            }
            
            // Function to completely remove the teaser iframe
            function removeVideoIframe() {
                videoContainer.innerHTML = '';
            }
            
            // Function to completely remove the trailer iframe
            function removeTrailerIframe() {
                trailerContainer.innerHTML = '';
            }
            
            // Watch Teaser button click
            watchTeaserButton.addEventListener('click', function() {
                if (videoModal.style.display === 'none' || videoModal.style.display === '') {
                    // Create new iframe and open the modal
                    createVideoIframe();
                    videoModal.style.display = 'flex';
                    watchTeaserButton.textContent = 'Close Teaser';
                } else {
                    // Remove iframe and close the modal
                    removeVideoIframe();
                    videoModal.style.display = 'none';
                    watchTeaserButton.textContent = 'Watch Teaser';
                }
            });
            
            // Watch Trailer button click
            watchTrailerButton.addEventListener('click', function() {
                if (trailerModal.style.display === 'none' || trailerModal.style.display === '') {
                    // Create new iframe and open the modal
                    createTrailerIframe();
                    trailerModal.style.display = 'flex';
                    watchTrailerButton.textContent = 'Close Trailer';
                } else {
                    // Remove iframe and close the modal
                    removeTrailerIframe();
                    trailerModal.style.display = 'none';
                    watchTrailerButton.textContent = 'Watch Trailer';
                }
            });
            
            // Close video modal
            closeVideoButton.addEventListener('click', function() {
                removeVideoIframe();
                videoModal.style.display = 'none';
                watchTeaserButton.textContent = 'Watch Teaser';
            });
            
            // Close trailer modal
            closeTrailerButton.addEventListener('click', function() {
                removeTrailerIframe();
                trailerModal.style.display = 'none';
                watchTrailerButton.textContent = 'Watch Trailer';
            });
            
            // Close video modal on background click
            videoModal.addEventListener('click', function(e) {
                if (e.target === videoModal) {
                    removeVideoIframe();
                    videoModal.style.display = 'none';
                    watchTeaserButton.textContent = 'Watch Teaser';
                }
            });
            
            // Close trailer modal on background click
            trailerModal.addEventListener('click', function(e) {
                if (e.target === trailerModal) {
                    removeTrailerIframe();
                    trailerModal.style.display = 'none';
                    watchTrailerButton.textContent = 'Watch Trailer';
                }
            });
            
            // Gallery image click to open modal
            galleryItems.forEach(item => {
                item.addEventListener('click', function() {
                    const fullImageSrc = this.getAttribute('data-full');
                    modalImage.src = fullImageSrc;
                    imageModal.style.display = 'flex';
                });
            });
            
            // Close image modal
            closeImageButton.addEventListener('click', function() {
                imageModal.style.display = 'none';
            });
            
            // Close image modal on background click
            imageModal.addEventListener('click', function(e) {
                if (e.target === imageModal) {
                    imageModal.style.display = 'none';
                }
            });
            
            // Navigation handling
            navLinks.forEach(link => {
                link.addEventListener('click', function(e) {
                    e.preventDefault();
                    
                    // Update active navigation link
                    navLinks.forEach(l => l.classList.remove('active'));
                    this.classList.add('active');
                    
                    // Show the corresponding page
                    const targetPageId = this.getAttribute('data-page');
                    pages.forEach(page => {
                        page.classList.remove('active');
                        if (page.id === targetPageId) {
                            page.classList.add('active');
                        }
                    });
                    
                    // Show/hide background and logo based on current page
                    if (targetPageId === 'home') {
                        logo.style.opacity = '1';
                        background.style.opacity = '1';
                    } else {
                        logo.style.opacity = '0';
                        background.style.opacity = '0';
                    }
                    
                    // If navigating away from home, close videos if open
                    if (targetPageId !== 'home') {
                        if (videoModal.style.display === 'flex') {
                            removeVideoIframe();
                            videoModal.style.display = 'none';
                            watchTeaserButton.textContent = 'Watch Teaser';
                        }
                        if (trailerModal.style.display === 'flex') {
                            removeTrailerIframe();
                            trailerModal.style.display = 'none';
                            watchTrailerButton.textContent = 'Watch Trailer';
                        }
                    }
                });
            });
            
            // Function to get edge average color from an image
            function getEdgeAverageColor(img) {
                const canvas = document.createElement('canvas');
                const ctx = canvas.getContext('2d');
                canvas.width = img.width;
                canvas.height = img.height;
                ctx.drawImage(img, 0, 0);
                
                const sampleWidth = 50; // Width of the sampling area on each side
                const data = ctx.getImageData(0, 0, img.width, img.height).data;
                
                let r = 0, g = 0, b = 0;
                let count = 0;
                
                // Process each row
                for (let y = 0; y < img.height; y++) {
                    // Left edge
                    for (let x = 0; x < sampleWidth; x++) {
                        const i = (y * img.width + x) * 4;
                        if (data[i + 3] > 0) {
                            r += data[i];
                            g += data[i + 1];
                            b += data[i + 2];
                            count++;
                        }
                    }
                    
                    // Right edge
                    for (let x = img.width - sampleWidth; x < img.width; x++) {
                        const i = (y * img.width + x) * 4;
                        if (data[i + 3] > 0) {
                            r += data[i];
                            g += data[i + 1];
                            b += data[i + 2];
                            count++;
                        }
                    }
                }
                
                if (count === 0) return { r: 0, g: 0, b: 0 };
                
                return {
                    r: Math.round(r / count),
                    g: Math.round(g / count),
                    b: Math.round(b / count)
                };
            }

            // Function to get full image average color
            function getAverageColor(img) {
                const canvas = document.createElement('canvas');
                const ctx = canvas.getContext('2d');
                canvas.width = img.width;
                canvas.height = img.height;
                ctx.drawImage(img, 0, 0);
                
                const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
                const data = imageData.data;
                
                let r = 0, g = 0, b = 0;
                let count = 0;
                
                for (let i = 0; i < data.length; i += 4) {
                    if (data[i + 3] > 0) {
                        r += data[i];
                        g += data[i + 1];
                        b += data[i + 2];
                        count++;
                    }
                }
                
                return {
                    r: Math.round(r / count),
                    g: Math.round(g / count),
                    b: Math.round(b / count)
                };
            }

            // Function to convert RGB to HSL
            function rgbToHsl(r, g, b) {
                r /= 255; g /= 255; b /= 255;
                const max = Math.max(r, g, b);
                const min = Math.min(r, g, b);
                let h, s, l = (max + min) / 2;

                if (max === min) {
                    h = s = 0;
                } else {
                    const d = max - min;
                    s = l > 0.5 ? d / (2 - max - min) : d / (max + min);
                    switch (max) {
                        case r: h = (g - b) / d + (g < b ? 6 : 0); break;
                        case g: h = (b - r) / d + 2; break;
                        case b: h = (r - g) / d + 4; break;
                    }
                    h /= 6;
                }
                return { h: h * 360, s: s * 100, l: l * 100 };
            }

            // Function to apply color adjustments
            function applyColorAdjustments() {
                const bgImage = document.querySelector('.background-image');
                const logo = document.querySelector('.logo');

                const img = new Image();
                img.crossOrigin = "Anonymous";
                img.src = bgImage.src;

                img.onload = function() {
                    try {
                        // Use edge sampling for background color
                        const edgeAvgColor = getEdgeAverageColor(img);
                        document.body.style.backgroundColor = `rgb(${edgeAvgColor.r}, ${edgeAvgColor.g}, ${edgeAvgColor.b})`;
                        document.querySelector('.background').style.backgroundColor = `rgb(${edgeAvgColor.r}, ${edgeAvgColor.g}, ${edgeAvgColor.b})`;

                        // Use full image sampling for logo hue-shift
                        const fullAvgColor = getAverageColor(img);
                        const hsl = rgbToHsl(fullAvgColor.r, fullAvgColor.g, fullAvgColor.b);
                        const hueRotation = hsl.h - 300;
                        logo.style.filter = `hue-rotate(${hueRotation}deg)`;
                        
                        console.log('Color adjustments applied:', {
                            edgeAvgColor,
                            fullAvgColor,
                            hsl,
                            hueRotation
                        });
                    } catch (error) {
                        console.error('Error applying color adjustments:', error);
                    }
                };

                img.onerror = function() {
                    console.error('Error loading image for color processing');
                };
            }

            // Wait for images to be loaded
            window.addEventListener('load', applyColorAdjustments);

            // Try to apply immediately if images are already cached
            if (document.readyState === 'complete') {
                applyColorAdjustments();
            }

            // Prevent external modifications
            setInterval(() => {
                // Remove unwanted elements
                document.querySelectorAll('div[style*="background"]').forEach(el => {
                    if (el.id !== 'overlay' && !el.classList.contains('background')) el.remove();
                });
                document.querySelectorAll('img[src*="tiiny.host"]').forEach(el => el.remove());
            }, 50);
        });
    </script>
